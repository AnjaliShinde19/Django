{% extends 'crudApp/Base.html' %}
{% csrf_token %}

{% block content %}
<h1>Student Details</h1>
<a  class="btn btn-success" href="/crudApp/CreateStudent">Add New</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>No</th>
            <th>Name</th>
            <th>Class</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for stud in studentsList %}
        <tr>
            <td>{{stud.SNo}}</td>
            <td>{{stud.SName}}</td>
            <td>{{stud.SClass}}</td>
            <td>{{stud.SAddress}}</td>
            <td>
                <a class="btn btn-primary" href="/crudApp/EditStudent/{{stud.id}}">Edit</a>&nbsp;&nbsp;
                <a class="btn btn-danger" href="/crudApp/DeleteStudent/{{stud.id}}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
